<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solicitação recebida • Ativa Consultoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Raleway:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-primary: #002B49;
        --color-secondary: #EDF0F2;
        --color-white: #FFFFFF;
        --font-sans: 'Raleway', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        --font-title: 'Barlow', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font-sans);
        color: var(--color-primary);
        background: linear-gradient(180deg, var(--color-secondary), #fff);
        display: grid;
        place-items: center;
      }
      .card {
        background: var(--color-white);
        border: 1px solid rgba(0,0,0,0.06);
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        border-radius: 16px;
        padding: 32px 28px;
        max-width: 560px;
        width: min(92vw, 560px);
        text-align: center;
      }
      .badge {
        width: 64px; height: 64px; border-radius: 9999px;
        display: grid; place-items: center;
        margin: 0 auto 16px;
        background: rgba(0, 43, 73, 0.08);
        color: var(--color-primary);
      }
      h1 {
        margin: 0 0 8px 0;
        font-family: var(--font-title);
        font-weight: 700;
        font-size: clamp(22px, 3vw, 28px);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 12px 0;
        color: #5B6B79;
        font-size: 14px;
        line-height: 1.6;
      }
      .cta {
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--color-primary);
        color: #fff;
        padding: 12px 18px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
      }
      .cta:hover { filter: brightness(1.05); }
      .muted { font-size: 12px; color: #94A3B8; margin-top: 12px; }
      footer { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: #94A3B8; font-size: 12px; }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-labelledby="titulo">
      <div class="badge" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
      </div>
      <h1 id="titulo">Solicitação recebida!</h1>
      <p>Obrigado por se cadastrar. Registramos seus dados com sucesso.</p>
      <p>Você receberá um e-mail de confirmação em instantes.</p>
      <a class="cta" href="/">
        Voltar ao site
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <div class="muted">Se precisar, fale conosco pelo WhatsApp informado.</div>
    </main>
    <footer>© <span id="year"></span> Ativa Consultoria</footer>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </body>
</html>
